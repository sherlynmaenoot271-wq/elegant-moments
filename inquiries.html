<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Elegant Moments</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

<style>
body { font-family: 'Lora', serif; }
.heading-font { font-family: 'Playfair Display', serif; }
.sidebar { background: linear-gradient(to bottom, #2E4F3A, #1F3A2B); }
.status-approved { background:#10b981;color:white;padding:5px 12px;border-radius:999px;font-size:12px; }
.status-pending { background:#eab308;color:white;padding:5px 12px;border-radius:999px;font-size:12px; }
</style>
</head>

<body class="bg-[#FFF8F0]">

<div class="flex h-screen">

<!-- SIDEBAR -->
<div class="sidebar w-72 text-white flex flex-col">
  <div class="p-6 text-center border-b border-white/20">
    <h1 class="text-2xl font-bold">Elegant Moments</h1>
  </div>

  <nav class="p-4 space-y-2">
    <button onclick="showSection('inquiries')" class="w-full text-left p-3 hover:bg-white/10 rounded-xl">📩 Inquiries</button>
    <button onclick="showSection('bookings')" class="w-full text-left p-3 hover:bg-white/10 rounded-xl">📅 Bookings</button>
  </nav>
</div>

<!-- MAIN CONTENT -->
<div class="flex-1 overflow-y-auto">

<!-- INQUIRIES -->
<div id="inquiries" class="p-8">
  <h2 class="text-2xl mb-4">Inquiries Management</h2>

  <table class="w-full bg-white rounded-xl overflow-hidden">
    <thead class="bg-[#2E4F3A] text-white">
      <tr>
        <th class="p-3">Name</th>
        <th class="p-3">Partner</th>
        <th class="p-3">Date</th>
        <th class="p-3">Venue</th>
        <th class="p-3">Action</th>
      </tr>
    </thead>
    <tbody id="inquiryTable"></tbody>
  </table>
</div>

<!-- BOOKINGS -->
<div id="bookings" class="p-8 hidden">
  <h2 class="text-2xl mb-4">Bookings Management</h2>

  <table class="w-full bg-white rounded-xl overflow-hidden">
    <thead class="bg-[#2E4F3A] text-white">
      <tr>
        <th class="p-3">Couple</th>
        <th class="p-3">Date</th>
        <th class="p-3">Venue</th>
        <th class="p-3">Status</th>
      </tr>
    </thead>
    <tbody id="bookingTable"></tbody>
  </table>
</div>

</div>
</div>

<script>
let inquiries = JSON.parse(localStorage.getItem("inquiries")) || [];
let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

/* SHOW SECTIONS */
function showSection(section) {
  document.getElementById("inquiries").classList.add("hidden");
  document.getElementById("bookings").classList.add("hidden");

  document.getElementById(section).classList.remove("hidden");
}

/* LOAD INQUIRIES */
function loadInquiries() {
  const table = document.getElementById("inquiryTable");
  table.innerHTML = "";

  if (inquiries.length === 0) {
    table.innerHTML = `<tr><td colspan="5" class="p-4 text-gray-400">No inquiries yet</td></tr>`;
    return;
  }

  inquiries.forEach((inq, index) => {
    table.innerHTML += `
      <tr class="border-b text-center">
        <td class="p-2">${inq.name}</td>
        <td class="p-2">${inq.partner}</td>
        <td class="p-2">${inq.date}</td>
        <td class="p-2">${inq.venue}</td>
        <td class="p-2 space-x-2">
          <button onclick="approveInquiry(${index})"
            class="bg-green-500 text-white px-3 py-1 rounded">
            Approve
          </button>
          <button onclick="declineInquiry(${index})"
            class="bg-red-500 text-white px-3 py-1 rounded">
            Decline
          </button>
        </td>
      </tr>
    `;
  });
}

/* LOAD BOOKINGS */
function loadBookings() {
  const table = document.getElementById("bookingTable");
  table.innerHTML = "";

  if (bookings.length === 0) {
    table.innerHTML = `<tr><td colspan="4" class="p-4 text-gray-400">No bookings yet</td></tr>`;
    return;
  }

  bookings.forEach(b => {
    table.innerHTML += `
      <tr class="border-b text-center">
        <td class="p-2">${b.name} & ${b.partner}</td>
        <td class="p-2">${b.date}</td>
        <td class="p-2">${b.venue}</td>
        <td class="p-2"><span class="status-approved">Approved</span></td>
      </tr>
    `;
  });
}

/* APPROVE */
function approveInquiry(index) {
  const approved = inquiries[index];
  approved.status = "Approved";

  bookings.push(approved);

  localStorage.setItem("bookings", JSON.stringify(bookings));

  inquiries.splice(index, 1);
  localStorage.setItem("inquiries", JSON.stringify(inquiries));

  loadInquiries();
  loadBookings();
}

/* DECLINE */
function declineInquiry(index) {
  inquiries.splice(index, 1);
  localStorage.setItem("inquiries", JSON.stringify(inquiries));

  loadInquiries();
}

/* INIT */
loadInquiries();
loadBookings();
</script>

</body>
</html>
