<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elegant Moments | Portfolio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- STYLE -->
    <style>

        body{
            font-family:'Lora', serif;
            background:#FFF8F0;
        }

        /* ================= NAVBAR ================= */

        .navbar{
            background:#c58a8a;
            padding:15px 0;
            z-index:9999;
        }

        .navbar-brand{
            color:white !important;
            font-size:1.7rem;
            font-weight:bold;
        }

        .navbar-nav .nav-link{
            color:black !important;
            font-weight:500;
            padding:8px 14px;
            border-radius:8px;
            transition:0.3s;
        }

        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active{
            background:white;
            color:#c084fc !important;
        }

        .btn-gold{
            background:white;
            border:none;
            border-radius:30px;
            padding:10px 24px;
            color:black !important;
            transition:0.3s;
        }

        .btn-gold:hover{
            background:#f8f0ff;
            color:#c084fc !important;
        }

        /* MOBILE NAV */

        @media(max-width:991px){

            .navbar-collapse{
                background:#c58a8a;
                padding:20px;
                border-radius:12px;
                margin-top:10px;
            }

            .navbar-nav .nav-link{
                margin-bottom:10px;
            }

        }

        /* ================= PORTFOLIO ================= */

        #portfolio{
            padding-top:120px;
            padding-bottom:80px;
        }

        .section-title{
            font-family:'Playfair Display', serif;
            color:#c58a8a;
            font-weight:bold;
        }

        .gallery-img{
            height:320px;
            object-fit:cover;
            transition:0.4s ease;
            box-shadow:0 4px 20px rgba(0,0,0,0.1);
        }

        .gallery-img:hover{
            transform:scale(1.03);
        }

    </style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg fixed-top navbar-dark">

    <div class="container">

        <!-- LOGO -->
        <a class="navbar-brand" href="index.html">
            <i class="fas fa-heart me-2"></i>
            Elegant Moments
        </a>

        <!-- TOGGLER -->
        <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- MENU -->
        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="services.html">
                        Services
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="portfolio.html">
                        Portfolio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="testimonials.html">
                        Stories
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="blog.html">
                        Inspiration
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">
                        Contact
                    </a>
                </li>

                <!-- BUTTON -->
                <li class="nav-item ms-lg-3">
                    <a href="booking.html" class="btn btn-gold">
                        Book Consultation
                    </a>
                </li>

                <!-- ADMIN -->
                <li class="nav-item ms-lg-2">
                    <a href="login.html" class="nav-link">
                        <i class="fas fa-user"></i> Admin
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- ================= PORTFOLIO ================= -->

<section id="portfolio">

    <div class="container">

        <div class="text-center mb-5">

            <h2 class="section-title display-5">
                Our Beautiful Moments
            </h2>

            <p class="lead text-muted">
                Capturing timeless love stories and unforgettable weddings
            </p>

        </div>

        <div class="row g-4">

            <!-- IMAGE 1 -->
            <div class="col-md-4">

                <img src="https://cdn.shopify.com/s/files/1/0023/8243/0257/files/Wedding-Colors-2025-Olive-nreem_600x600.jpg?v=1726510729"
                class="gallery-img w-100 rounded-4"
                alt="Beach Wedding">

            </div>

            <!-- IMAGE 2 -->
            <div class="col-md-4">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzkKeDcjYWKqlCQGlpDR-aILxWmoFZQ31nzA&s"
                class="gallery-img w-100 rounded-4"
                alt="Garden Ceremony">

            </div>

            <!-- IMAGE 3 -->
            <div class="col-md-4">

                <img src="https://i.pinimg.com/736x/32/53/fd/3253fd3f1f9d95b47d99fbbc2ad4caf6.jpg"
                class="gallery-img w-100 rounded-4"
                alt="Elegant Reception">

            </div>

        </div>

    </div>

</section>

<!-- ================= BOOTSTRAP JS ================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ================= AUTO CLOSE MOBILE MENU ================= -->

<script>

const navLinks = document.querySelectorAll('.nav-link, .btn-gold');
const navbarCollapse = document.getElementById('navbarNav');

navLinks.forEach(link => {

    link.addEventListener('click', () => {

        if(window.innerWidth < 992){

            const bsCollapse = new bootstrap.Collapse(navbarCollapse,{
                toggle:false
            });

            bsCollapse.hide();

        }

    });

});

</script>

</body>
</html>
