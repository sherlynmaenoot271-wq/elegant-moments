<!-- Contact / Inquiry -->
<section id="contact" class="py-5 bg-white">
    <div class="container py-5">
        <div class="row">
            <div class="col-lg-6">
                <h2 class="display-5 mb-4">Let's Make Magic Happen</h2>
                <p class="lead">Tell us about your dream wedding and we'll create something unforgettable together.</p>
         
                <form id="inquiryForm">
                    <div class="row">
                        <div class="col-md-6">
                            <label>Your Name</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label>Partner's Name</label>
                            <input type="text" id="partner" class="form-control">
                        </div>
                    </div>

                    <div class="mt-3">
                        <label>Email Address</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>

                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label>Wedding Date</label>
                            <input type="date" id="date" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label>Venue / Location</label>
                            <input type="text" id="venue" class="form-control">
                        </div>
                    </div>

                    <div class="mt-3">
                        <label>Message</label>
                        <textarea id="message" class="form-control" rows="4" required></textarea>
                    </div>
           <button type="submit" class="bg-[#2E4F3A] text-white px-6 py-3 rounded-xl">
    Send Inquiry
  </button>
    </div>
</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function closeMobileMenu() {
    if (window.innerWidth < 992) {
        const navbarCollapse = document.getElementById('navbarNav');
        const bsCollapse = new bootstrap.Collapse(navbarCollapse, { toggle: false });
        bsCollapse.hide();
    }
}

const navLinks = document.querySelectorAll('#navbarNav .nav-link, .btn-gold');
const navbarCollapse = document.getElementById('navbarNav');

navLinks.forEach(link => {
    link.addEventListener('click', function() {
        if (window.innerWidth < 992) {
            const bsCollapse = new bootstrap.Collapse(navbarCollapse, { toggle: false });
            bsCollapse.hide();
        }
    });
});
</script>
<script>
document.getElementById("inquiryForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const form = e.target;

  const inquiry = {
    name: form.name.value,
    partner: form.partner.value,
    email: form.email.value,
    date: form.date.value,
    venue: form.venue.value,
    message: form.message.value,
    time: new Date().toLocaleString(),
    status: "Pending"
  };

  let inquiries = JSON.parse(localStorage.getItem("inquiries")) || [];

  inquiries.push(inquiry);

  localStorage.setItem("inquiries", JSON.stringify(inquiries));

  alert("✅ Inquiry submitted successfully!");

  form.reset();
});

document.getElementById("inquiryForm").addEventListener("submit", function(e) {
    e.preventDefault();

    // Get values using ID
    const inquiry = {
        name: document.getElementById("name").value,
        partner: document.getElementById("partner").value,
        email: document.getElementById("email").value,
        date: document.getElementById("date").value,
        venue: document.getElementById("venue").value,
        message: document.getElementById("message").value,
        time: new Date().toLocaleString()
    };

    // Get existing inquiries
    let inquiries = JSON.parse(localStorage.getItem("inquiries")) || [];

    // Add new inquiry
    inquiries.push(inquiry);

    // Save to localStorage
    localStorage.setItem("inquiries", JSON.stringify(inquiries));

    alert("Inquiry sent successfully!");

    // Reset form
    document.getElementById("inquiryForm").reset();
});
</script>
