<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elegant Moments Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card p-5 shadow">
                <div class="text-center mb-4">
                    <i class="fas fa-heart fa-3x text-warning"></i>
                    <h2 class="mt-3">Admin Login</h2>
                    <p class="text-muted">Elegant Moments Wedding Planner</p>
                </div>

                <form id="loginForm">
                   <div class="mb-4">
    <label class="mb-2">Username</label>
    <input type="text" class="form-control py-3" id="username" placeholder="Enter username" required>
</div>

<div class="mb-3">
    <label class="mb-2">Password</label>
    <input type="password" class="form-control py-3" id="password" placeholder="Enter password" required>
</div>
                    <button type="submit" class="btn btn-warning w-100 py-3">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    if (username === "sherlyn" && password === "admin123") {

        // ✅ SAVE LOGIN SESSION
        localStorage.setItem("isLoggedIn", "true");

        Swal.fire({
            title: "Login Successful!",
            text: "Redirecting to Dashboard...",
            icon: "success",
            timer: 1500,
            showConfirmButton: false
        }).then(() => {
            window.location.href = "dashboard.html";
        });

    } else {
        Swal.fire({
            title: "Login Failed",
            text: "Incorrect username or password",
            icon: "error"
        });
    }
});
</script>

</body>
</html>
